kind = "web"
previewPath = "/"
title = "M-soft Account Protection"
description = "M-soft Account Protection — Bank Grade Security System for secure applicant enrollment and authorized staff review."
version = "1.0.0"
id = "artifacts/enrollment-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21914

[services.development]
run = "pnpm --filter @workspace/enrollment-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/enrollment-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/enrollment-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21914"
BASE_PATH = "/"
