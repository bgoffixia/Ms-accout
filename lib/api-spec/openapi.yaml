openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enrollment
    description: Applicant enrollment and application operations
  - name: administration
    description: Administrator application review and support
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enrollment/categories:
    get:
      operationId: listEnrollmentCategories
      tags: [enrollment]
      summary: List the four available enrollment categories
      responses:
        "200":
          description: Available enrollment categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentCategory"
  /me/applications:
    get:
      operationId: listMyApplications
      tags: [enrollment]
      summary: List the signed-in applicant's applications
      responses:
        "200":
          description: Applicant applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentApplication"
  /me/drafts:
    delete:
      operationId: deleteMyDrafts
      tags: [enrollment]
      summary: Delete unfinished applications belonging to the signed-in applicant
      responses:
        "200":
          description: Number of unfinished applications deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMyApplicationDraftsResponse"
  /applications/submit:
    post:
      operationId: submitNewApplication
      tags: [enrollment]
      summary: Validate and submit a completed application without storing a draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApplicationSubmissionInput"
      responses:
        "201":
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /applications/tracking/lookup:
    post:
      operationId: lookupApplicationByTrackingKey
      tags: [enrollment]
      summary: Look up an applicant-owned application with its reference and private tracking key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationTrackingLookupInput"
      responses:
        "200":
          description: Safe application status for the matching applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccessStatus"
        "404":
          description: Application reference and private tracking key could not be verified
  /applications/drafts:
    post:
      operationId: createApplicationDraft
      tags: [enrollment]
      summary: Create a server-saved draft for the signed-in applicant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDraftInput"
      responses:
        "201":
          description: Created application draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /applications/{applicationId}:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getApplication
      tags: [enrollment]
      summary: Get an application owned by the signed-in applicant
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
    patch:
      operationId: updateApplication
      tags: [enrollment]
      summary: Save changes to an application draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /applications/{applicationId}/submit:
    post:
      operationId: submitApplication
      tags: [enrollment]
      summary: Submit a completed application for review
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingApplicationSubmissionInput"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
  /dashboard/summary:
    get:
      operationId: getApplicantSummary
      tags: [enrollment]
      summary: Get applicant dashboard summary
      responses:
        "200":
          description: Applicant dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantSummary"
  /guest/preapplications:
    post:
      operationId: createGuestPreapplication
      tags: [enrollment]
      summary: Create a guest pre-application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPreapplicationInput"
      responses:
        "200":
          description: Previously created submission returned for a safe retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPreapplicationCreated"
        "201":
          description: Guest pre-application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPreapplicationCreated"
  /guest/preapplications/tracking-key/recover:
    post:
      operationId: recoverGuestTrackingKey
      tags: [enrollment]
      summary: Replace a guest tracking key using its verified Clerk email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestTrackingKeyRecoveryInput"
      responses:
        "200":
          description: One-time replacement key; the previous key is invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestTrackingKeyRecoveryResponse"
        "404":
          description: Application reference and verified email could not be matched
  /guest/preapplications/lookup:
    post:
      operationId: lookupGuestPreapplication
      tags: [enrollment]
      summary: Restore a guest pre-application using its reference and private tracking key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPreapplicationLookupInput"
      responses:
        "200":
          description: Full guest application state for the matching applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPreapplicationStatus"
        "404":
          description: Application reference and private tracking key could not be verified
  /guest/preapplications/{applicationId}:
    patch:
      operationId: updateGuestPreapplicationProgress
      tags: [enrollment]
      summary: Save guest application progress using its reference and private tracking key
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPreapplicationProgressInput"
      responses:
        "200":
          description: Saved guest application progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPreapplicationStatus"
        "404":
          description: Application reference and private tracking key could not be verified
        "409":
          description: Application is closed
  /guest/preapplications/{applicationId}/email:
    patch:
      operationId: updateGuestPreapplicationEmail
      tags: [enrollment]
      summary: Correct a guest applicant email using its reference and private tracking key
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPreapplicationEmailUpdate"
      responses:
        "200":
          description: Updated unsubmitted guest application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPreapplicationStatus"
        "404":
          description: Application reference and private tracking key could not be verified
        "409":
          description: Application is already submitted or closed
  /guest/preapplications/{applicationId}/evidence/upload-url:
    post:
      operationId: requestGuestApplicantEvidenceUpload
      tags: [enrollment]
      summary: Prepare a private applicant evidence upload
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestApplicantEvidenceUploadInput"
      responses:
        "200":
          description: Private upload URL prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestEvidenceUploadUrl"
        "404":
          description: Application reference and private tracking key could not be verified
  /guest/preapplications/{applicationId}/evidence/{evidenceId}/complete:
    post:
      operationId: completeGuestApplicantEvidenceUpload
      tags: [enrollment]
      summary: Verify a private evidence upload and attach it to the guest application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestApplicationAccessInput"
      responses:
        "200":
          description: Evidence uploaded and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestApplicantEvidenceUploaded"
        "404":
          description: Application reference and private tracking key could not be verified
  /guest/preapplications/{applicationId}/submit:
    post:
      operationId: submitGuestPreapplication
      tags: [enrollment]
      summary: Submit a saved guest application before email verification
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestApplicationAccessInput"
      responses:
        "200":
          description: Guest application submitted; email verification is required only for status access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPreapplicationStatus"
  /guest/preapplications/{applicationId}/link:
    post:
      operationId: linkGuestPreapplicationAccount
      tags: [enrollment]
      summary: Link a submitted guest application to its verified applicant account
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestApplicationAccessInput"
      responses:
        "200":
          description: Verified guest application linked to the applicant account for status access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplication"
        "403":
          description: The signed-in primary email is not verified or does not match the application
        "404":
          description: Application reference and private key could not be verified
  /staff/registration-check:
    post:
      operationId: checkStaffRegistrationEmail
      tags: [administration]
      summary: Check whether an email is allowed to use staff registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRegistrationCheckInput"
      responses:
        "200":
          description: Whether the email is authorized for staff registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRegistrationCheckResponse"
        "400":
          description: Invalid email address
  /staff/access-claim:
    post:
      operationId: claimAllowlistedStaffAccess
      tags: [administration]
      summary: Assign the allowed staff role to a verified allowlisted account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccessClaimInput"
      responses:
        "200":
          description: The role assigned to the verified account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccessClaimResponse"
        "401":
          description: Sign-in required
        "403":
          description: Verified email is not authorized for staff access
  /admin/guest-preapplications:
    get:
      operationId: listAdminGuestPreapplications
      tags: [administration]
      summary: List guest pre-applications for authorized reviewers
      responses:
        "200":
          description: Guest pre-applications ordered by most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminGuestPreapplication"
  /admin/guest-preapplications/{applicationId}/invitation-code/reveal:
    post:
      operationId: revealAdminGuestPreapplicationInvitationCode
      tags: [administration]
      summary: Reveal a guest Invitation Code to an authorized reviewer on demand
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation Code revealed to the authorized reviewer; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCodeReveal"
        "401":
          description: Sign-in required
        "403":
          description: Reviewer role required
        "404":
          description: Code or guest application unavailable
        "503":
          description: Code protection is temporarily unavailable
  /admin/applicants/clear:
    post:
      operationId: clearApplicantRecords
      tags: [administration]
      summary: Permanently remove selected applicant records and their private evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearApplicantRecordsInput"
      responses:
        "200":
          description: Number of selected records removed and any records that could not be cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantRecordsClearResult"
        "400":
          description: Invalid applicant selection
        "401":
          description: Sign-in required
        "403":
          description: Reviewer access required
  /admin/guest-preapplications/{applicationId}:
    patch:
      operationId: updateAdminGuestPreapplication
      tags: [administration]
      summary: Update guest pre-application follow-up status
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGuestPreapplicationStatusUpdate"
      responses:
        "200":
          description: Updated guest pre-application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGuestPreapplication"
  /admin/guest-preapplications/{applicationId}/evidence/upload-url:
    post:
      operationId: requestGuestPreapplicationEvidenceUpload
      tags: [administration]
      summary: Request a private upload URL for guest application evidence
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestEvidenceUploadInput"
      responses:
        "200":
          description: Private upload URL for the reviewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestEvidenceUploadUrl"
  /admin/guest-preapplications/{applicationId}/evidence/{evidenceId}/complete:
    post:
      operationId: completeGuestPreapplicationEvidenceUpload
      tags: [administration]
      summary: Verify and record an uploaded guest evidence file
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Verified private evidence metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGuestPreapplicationEvidence"
  /admin/guest-preapplications/{applicationId}/evidence/{evidenceId}/file:
    get:
      operationId: downloadGuestPreapplicationEvidence
      tags: [administration]
      summary: Download private guest application evidence
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evidence file streamed as an attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Uploaded evidence not found
  /admin/applications:
    get:
      operationId: listApplicationsForReview
      tags: [administration]
      summary: List applications for authorized administrators
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                draft,
                submitted,
                under_review,
                needs_information,
                approved,
                rejected,
              ]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Applications matching the review filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentApplication"
  /admin/applications/{applicationId}:
    get:
      operationId: getAdminApplication
      tags: [administration]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full enrollment record for an authorized reviewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnrollmentApplication"
  /admin/reviewer-assignments/{applicationType}/{applicationId}:
    parameters:
      - name: applicationType
        in: path
        required: true
        schema:
          type: string
          enum: [guest_preapplication, enrollment_application]
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAdminReviewerAssignment
      tags: [administration]
      summary: Get the assigned reviewer for an application
      responses:
        "200":
          description: Reviewer assignment for this application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReviewerAssignment"
        "401":
          description: Sign-in required
        "403":
          description: Primary administrator access required
        "404":
          description: Application not found
    put:
      operationId: setAdminReviewerAssignment
      tags: [administration]
      summary: Assign or unassign an authorized Sub-admin reviewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetApplicationReviewerAssignmentInput"
      responses:
        "200":
          description: Reviewer assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReviewerAssignment"
        "400":
          description: Invalid assignment
        "401":
          description: Sign-in required
        "403":
          description: Primary administrator or eligible reviewer required
        "404":
          description: Application not found
        "503":
          description: Reviewer access could not be verified
  /admin/applications/{applicationId}/invitation-code/reveal:
    post:
      operationId: revealAdminApplicationInvitationCode
      tags: [administration]
      summary: Reveal an application Invitation Code to an authorized reviewer on demand
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation Code revealed to the authorized reviewer; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCodeReveal"
        "401":
          description: Sign-in required
        "403":
          description: Reviewer role required
        "404":
          description: Code or application unavailable
        "503":
          description: Code protection is temporarily unavailable
  /admin/applications/{applicationId}/evidence/{evidenceId}/file:
    get:
      operationId: downloadSubmittedApplicationEvidence
      tags: [administration]
      summary: Download private evidence attached to a submitted guest application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private evidence file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Application or evidence file not found
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [administration]
      summary: Get administrator dashboard totals
      responses:
        "200":
          description: Database-backed overview totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [administration]
      summary: Search and list user accounts with enrollment status
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: accountStatus
          in: query
          schema:
            type: string
            enum: [active, suspended]
      responses:
        "200":
          description: User accounts and latest enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
  /admin/users/invitations:
    post:
      operationId: createAdminUserInvitation
      tags: [administration]
      summary: Invite a staff member to create an account with an approved role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInvitationInput"
      responses:
        "201":
          description: Staff invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserInvitationResponse"
        "409":
          description: The email already has an account or an active invitation
  /admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [administration]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusUpdate"
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/users/{userId}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [administration]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserRoleUpdate"
      responses:
        "200":
          description: Updated staff role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /portal/settings:
    get:
      operationId: getPortalSettings
      tags: [portal]
      summary: Get public portal content and theme settings
      responses:
        "200":
          description: Portal theme and editable content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSettings"
  /applicant/form-content:
    get:
      operationId: getApplicantFormContent
      tags: [portal]
      summary: Get current applicant form content
      responses:
        "200":
          description: Current form defaults and persisted applicant-facing text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantFormContentSnapshot"
        "503":
          description: Production form content is not available
  /admin/form-content:
    get:
      operationId: getAdminApplicantFormContent
      tags: [administration]
      summary: Get editable applicant form content and its catalog
      responses:
        "200":
          description: Form content, version, and editable form catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicantFormContent"
        "401":
          description: Sign-in required
        "403":
          description: Primary administrator access required
        "503":
          description: Production form content is not available
    put:
      operationId: updateAdminApplicantFormContent
      tags: [administration]
      summary: Save applicant form content with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantFormContentUpdate"
      responses:
        "200":
          description: Saved form content and new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicantFormContent"
        "400":
          description: Invalid form content
        "401":
          description: Sign-in required
        "403":
          description: Primary administrator access required
        "409":
          description: Content changed in another session
        "503":
          description: Production form content is not available
  /admin/form-content/reset:
    post:
      operationId: resetAdminApplicantFormContent
      tags: [administration]
      summary: Restore all applicant form content defaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantFormContentResetInput"
      responses:
        "200":
          description: Restored defaults and new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicantFormContent"
        "401":
          description: Sign-in required
        "403":
          description: Primary administrator access required
        "409":
          description: Content changed in another session
