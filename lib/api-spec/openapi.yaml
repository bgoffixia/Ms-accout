        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        subject: { type: string, maxLength: 200 }
        messageText: { type: string, maxLength: 10000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminEmailTemplateInput:
      type: object
      required: [name, subject, messageText]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        messageText: { type: string, minLength: 1, maxLength: 10000 }
    AdminEmailMessage:
      type: object
      required:
        [
          id,
          recipientEmail,
          subject,
          messageText,
          eventKind,
          applicationReference,
          status,
          providerMessageId,
          deliveryStatus,
          providerEventAt,
          providerEvents,
          errorMessage,
          createdByUserId,
          attemptCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        recipientEmail: { type: string, format: email }
        subject: { type: string }
        messageText: { type: string }
        eventKind:
          type: ["string", "null"]
          enum:
            [
              contact_received,
              step_saved,
              contact_updated,
              evidence_saved,
              application_submitted,
              manual,
              null,
            ]
        applicationReference: { type: ["string", "null"] }
        status: { type: string, enum: [sending, sent, failed] }
        providerMessageId: { type: ["string", "null"] }
        deliveryStatus:
          {
            type: ["string", "null"],
            enum: [accepted, delivered, bounced, complained, null],
          }
        providerEventAt: { type: ["string", "null"], format: date-time }
        providerEvents:
          type: array
          items:
            $ref: "#/components/schemas/AdminEmailProviderEvent"
        errorMessage: { type: ["string", "null"] }
        createdByUserId: { type: ["string", "null"] }
        attemptCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminEmailProviderEvent:
      type: object
      required: [deliveryStatus, providerEventAt]
      properties:
        deliveryStatus: { type: string, enum: [delivered, bounced, complained] }
        providerEventAt: { type: string, format: date-time }
    AdminSmsSettings:
      type: object
      required:
        [
          baseUrl,
          senderId,
          credentialConfigured,
          deliveryReportUrl,
          deliveryReportsConfigured,
          dailyLimit,
          dailyUsageCount,
          canConfigure,
          updatedAt,
        ]
      properties:
        baseUrl: { type: string, maxLength: 255 }
        senderId: { type: string, maxLength: 11 }
        credentialConfigured: { type: boolean }
        deliveryReportUrl: { type: ["string", "null"], format: uri }
        deliveryReportsConfigured: { type: boolean }
        dailyLimit: { type: integer, minimum: 0, maximum: 100000 }
        dailyUsageCount: { type: integer, minimum: 0 }
        canConfigure: { type: boolean }
        updatedAt: { type: ["string", "null"], format: date-time }
    AdminSmsSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        baseUrl:
          type: string
          minLength: 1
          maxLength: 255
          format: uri
        senderId:
          type: string
          minLength: 3
          maxLength: 11
          pattern: "^[A-Za-z0-9]+$"
        dailyLimit:
          type: integer
          minimum: 0
          maximum: 100000
    AdminSmsSendInput:
      type: object
      required: [recipientPhone, messageText]
      properties:
        recipientPhone:
          type: string
          minLength: 9
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        messageText:
          type: string
          minLength: 1
          maxLength: 1600
    AdminSmsSendResponse:
      type: object
      required:
        [
          id,
          recipientPhone,
          senderId,
          messageText,
          status,
          providerMessageId,
          providerStatus,
          providerStatusGroup,
          providerStatusAt,
          acceptedAt,
          errorMessage,
          createdByUserId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        recipientPhone: { type: string }
        senderId: { type: string }
        messageText: { type: string }
        status: { type: string, enum: [sending, accepted, delivered, failed] }
        providerMessageId: { type: ["string", "null"] }
        providerStatus: { type: ["string", "null"] }
        providerStatusGroup: { type: ["string", "null"] }
        providerStatusAt: { type: ["string", "null"], format: date-time }
        acceptedAt: { type: ["string", "null"], format: date-time }
        errorMessage: { type: ["string", "null"] }
        createdByUserId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminSmsMessage:
      allOf:
        - $ref: "#/components/schemas/AdminSmsSendResponse"
    InfobipSmsDeliveryReport:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              messageId: { type: string }
              callbackData: { type: string }
              doneAt: { type: string, format: date-time }
              status:
                type: object
                properties:
                  groupName: { type: string }
                  name: { type: string }
                  description: { type: string }
