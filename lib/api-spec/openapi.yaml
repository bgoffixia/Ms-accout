components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnrollmentCategory:
      type: object
      required: [id, name, description, accent]
      properties:
        id:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        name:
          type: string
        description:
          type: string
        accent:
          type: string
    GuestPreapplicationStatusValue:
      type: string
      enum: [received, contacted, closed]
    GuestPreapplicationInput:
      type: object
      required: [submissionId, trackingKey, categoryId, fullName, email]
      properties:
        submissionId:
          type: string
          format: uuid
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 40
    ApplicationTrackingLookupInput:
      type: object
      required: [reference, trackingKey]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 32
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    GuestPreapplicationLookupInput:
      type: object
      required: [reference, trackingKey]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 32
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    GuestTrackingKeyRecoveryInput:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 32
    GuestTrackingKeyRecoveryResponse:
      type: object
      required: [trackingKey]
      properties:
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    ApplicationAccessStatus:
      type: object
      required:
        [
          applicationId,
          reference,
          applicationType,
          categoryId,
          categoryName,
          status,
          submissionStatus,
          currentStep,
          detailsComplete,
          updatedAt,
          reviewStatus,
          applicantFollowup,
          outstandingRequirements,
        ]
      properties:
        applicationId:
          type: string
          format: uuid
        reference:
          type: string
        applicationType:
          type: string
          enum: [guest_preapplication, enrollment_application]
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        categoryName:
          type: string
        status:
          type: string
          enum:
            [
              received,
              contacted,
              closed,
              draft,
              submitted,
              under_review,
              needs_information,
              approved,
              rejected,
            ]
        submissionStatus:
          type: string
          enum: [draft, submitted]
        currentStep:
          type: integer
          minimum: 0
          maximum: 7
        detailsComplete:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        reviewStatus:
          type: ["string", "null"]
          enum:
            [
              draft,
              submitted,
              under_review,
              needs_information,
              approved,
              rejected,
              null,
            ]
        applicantFollowup:
          type: ["string", "null"]
        outstandingRequirements:
          type: array
          items:
            type: string
    GuestPreapplicationCreated:
      type: object
      required:
        [
          id,
          reference,
          categoryId,
          categoryName,
          fullName,
          email,
          status,
          submissionStatus,
          emailVerified,
          linkedApplicationId,
          currentStep,
          detailsComplete,
          createdAt,
          updatedAt,
          trackingKey,
        ]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        categoryName:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/GuestPreapplicationStatusValue"
        submissionStatus:
          type: string
          enum: [draft, submitted]
        emailVerified:
          type: boolean
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        linkedApplicationId:
          type: string
          format: uuid
          nullable: true
        currentStep:
          type: integer
          minimum: 0
          maximum: 7
        detailsComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GuestPreapplicationStatus:
      type: object
      required:
        [
          id,
          reference,
          categoryId,
          categoryName,
          fullName,
          email,
          status,
          submissionStatus,
          emailVerified,
          emailVerificationRequired,
          linkedApplicationId,
          currentStep,
          detailsComplete,
          answers,
          createdAt,
          updatedAt,
          reviewStatus,
          applicantFollowup,
          outstandingRequirements,
        ]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        categoryId:
          type: string
          enum: [category-1, category-2, category-3, category-4]
        categoryName:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/GuestPreapplicationStatusValue"
        submissionStatus:
          type: string
          enum: [draft, submitted]
        emailVerified:
          type: boolean
        emailVerificationRequired:
          type: boolean
        linkedApplicationId:
          type: ["string", "null"]
          format: uuid
        currentStep:
          type: integer
          minimum: 0
          maximum: 7
        detailsComplete:
          type: boolean
        answers:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewStatus:
          type: ["string", "null"]
          enum:
            [
              draft,
              submitted,
              under_review,
              needs_information,
              approved,
              rejected,
              null,
            ]
        applicantFollowup:
          type: ["string", "null"]
        outstandingRequirements:
          type: array
          items:
            type: string
    GuestPreapplicationRevision:
      type: object
      required: [id, currentStep, changes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        currentStep:
          type: integer
          minimum: 0
          maximum: 7
        changes:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                type: string
              after:
                type: string
        createdAt:
          type: string
          format: date-time
    GuestPreapplicationProgressInput:
      type: object
      required: [reference, trackingKey, currentStep, answers, complete]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 32
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        currentStep:
          type: integer
          minimum: 0
          maximum: 7
        answers:
          type: object
          additionalProperties: true
        complete:
          type: boolean
        referenceCode:
          type: string
          maxLength: 80
    GuestApplicationAccessInput:
      type: object
      required: [reference, trackingKey]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 32
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    GuestPreapplicationEmailUpdate:
      type: object
      required: [reference, trackingKey, email]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 32
        trackingKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        email:
          type: string
          format: email
          maxLength: 320
    AdminGuestPreapplication:
      allOf:
        - $ref: "#/components/schemas/GuestPreapplicationStatus"
        - type: object
          required:
            [
              fullName,
              email,
              phone,
              reviewReady,
              evidence,
              history,
              assignedReviewerUserId,
            ]
          properties:
            fullName:
              type: string
            email:
              type: string
              format: email
            phone:
              type: ["string", "null"]
            reviewReady:
              type: boolean
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/AdminGuestPreapplicationEvidence"
            history:
              type: array
              items:
                $ref: "#/components/schemas/GuestPreapplicationRevision"
            assignedReviewerUserId:
              type: ["string", "null"]
    ApplicationReviewerAssignment:
      type: object
      required: [applicationType, applicationId, reviewerUserId]
      properties:
        applicationType:
          type: string
          enum: [guest_preapplication, enrollment_application]
        applicationId:
          type: string
          format: uuid
        reviewerUserId:
          type: ["string", "null"]
    SetApplicationReviewerAssignmentInput:
      type: object
      required: [reviewerUserId]
      properties:
        reviewerUserId:
          type: ["string", "null"]
          minLength: 1
          maxLength: 255
    GuestEvidenceUploadInput:
      type: object
      required: [evidenceType, fileName, contentType, sizeBytes]
      properties:
