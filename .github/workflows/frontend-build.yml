name: Application build

on:
  push:
    branches: [main]
    paths:
      - "artifacts/enrollment-portal/**"
      - "artifacts/api-server/**"
      - "Dockerfile"
      - "railway.json"
      - "RAILWAY_DEPLOYMENT.md"
      - "lib/api-client-react/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "artifacts/enrollment-portal/**"
      - "lib/api-client-react/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared TypeScript declarations
        run: pnpm run typecheck:libs

      - name: Type-check frontend
        run: pnpm --filter @workspace/enrollment-portal typecheck

      - name: Type-check API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Build frontend
        run: pnpm --filter @workspace/enrollment-portal build
