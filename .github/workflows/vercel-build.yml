name: Vercel deployment build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - vercel/deployment

permissions:
  contents: read

concurrency:
  group: vercel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vercel frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vercel frontend output
        run: pnpm --filter @workspace/enrollment-portal build

      - name: Verify Vercel output exists
        run: test -f artifacts/enrollment-portal/dist/public/index.html
